<div class="flex flex-col items-center justify-center min-h-screen bg-gray-50 p-6 text-center">
  <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-200 max-w-md w-full">
    <div [class]="'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 ' + iconBgColor">
      <i [class]="'pi ' + icon + ' text-4xl ' + iconColor"></i>
    </div>

    <h2 class="text-2xl font-bold text-gray-900 mb-2">{{ title }}</h2>
    <p class="text-gray-500 mb-8">{{ message }}</p>

    <p-button
      [label]="buttonLabel"
      [icon]="'pi ' + buttonIcon"
      [styleClass]="'p-button-secondary p-button-outlined w-full py-3'"
      (onClick)="onAction.emit()">
    </p-button>
  </div>
</div>
