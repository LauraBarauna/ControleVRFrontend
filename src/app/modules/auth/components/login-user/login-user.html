<div class="flex justify-center items-center min-h-screen bg-gray-50 p-4">
  <div class="w-full max-w-md bg-white p-6 md:p-8 rounded-xl shadow-lg">
    <p-toast position="top-center"></p-toast>

    <header class="mb-8 text-center">
      <h2 class="text-2xl font-bold text-gray-800">Olá novamente!</h2>
      <p class="text-sm text-gray-500">Faça login na sua conta para acessar o sistema</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6 mt-12">

      <div class="flex flex-col gap-8">

        <div class="flex flex-col">
          <p-floatLabel>
            <input pInputText id="username" formControlName="username" class="w-full" />
            <label for="username">Nome de Usuário</label>
          </p-floatLabel>
          <app-field-errors [control]="username"></app-field-errors>
        </div>

        <div class="flex flex-col">
          <p-floatLabel>
            <p-password
              id="password"
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
              inputStyleClass="w-full"
              styleClass="w-full"
              fluid>
            </p-password>
            <label for="password">Senha</label>
          </p-floatLabel>
          <app-field-errors [control]="password"></app-field-errors>
        </div>

      </div>

      <p-button
        label="Logar"
        type="submit"
        styleClass="w-full mt-4"
        severity="primary">
      </p-button>

    </form>
  </div>
</div>
